<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фото и видео</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px 40px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }
    .page {
      max-width: 850px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }
    h1 {
      text-align: center;
      margin: 4px 0 24px;
    }
    .photo {
      display: block;
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .video-block {
      margin-top: 28px;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    video {
      display: block;
      width: 100%;
      border-radius: 12px;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Фото и видео</h1>

    <img
      class="photo"
      src="photo_2026-09-13_13-28-32.jpg"
      alt="Фотография"
    >

    <section class="video-block">
      <h2>Видео 1</h2>
      <video controls playsinline preload="metadata">
        <source src="video_2026-09-13_13-41-07.mp4" type="video/mp4">
        Ваш браузер не поддерживает воспроизведение видео.
      </video>
    </section>

    <section class="video-block">
      <h2>Видео 2</h2>
      <video controls playsinline preload="metadata">
        <source src="убайдарынаан.mp4" type="video/mp4">
        Ваш браузер не поддерживает воспроизведение видео.
      </video>
    </section>

    <section class="video-block">
      <h2>Видео 3</h2>
      <video controls playsinline preload="metadata">
        <source src="кийиитэрдиин ийэбит.mp4" type="video/mp4">
        Ваш браузер не поддерживает воспроизведение видео.
      </video>
    </section>

  </main>
</body>
</html>

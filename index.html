<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фото и видео</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      justify-content: center;
      padding: 24px 14px 40px;
    }
    .page {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }
    h1 {
      text-align: center;
      margin: 4px 0 22px;
      font-size: 28px;
    }
    .photo {
      display: block;
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      margin: 0 auto 24px;
    }
    .video-title {
      text-align: center;
      margin: 8px 0 14px;
      font-size: 22px;
    }
    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
    }
    .hint {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Фото</h1>

    <img
      class="photo"
      src="photo_2026-09-13_13-28-32.jpg"
      alt="Фотография"
    >

    <h2 class="video-title">Видео</h2>

    <video controls playsinline preload="metadata">
      <source src="video_2026-09-13_13-41-07.mp4" type="video/mp4">
      Ваш браузер не поддерживает воспроизведение видео.
    </video>

    <p class="hint">Нажмите ▶, чтобы посмотреть видео.</p>
  </main>
</body>
</html>
